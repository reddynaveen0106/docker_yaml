services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
  
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes: 
      -  pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5
      retries: 5
    networks:
      -  appnet

  backend: 
    build: ./backend
    restart: unless-stopped

    environment:
      DATABASE_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy
    ports: 
      -  "8080:8080"
    networks:
      -  appnet

  frontend:
    build: ./frontend
    restart: unless-stopped

    depends_on: 
      -  backend
    
    ports: 
      -  "8081:80"
    networks:
      -  appnet

volumes:
  pgdata:

networks:
  appnet: